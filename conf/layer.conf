# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-poly-tc8"
BBFILE_PATTERN_meta-poly-tc8 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-poly-tc8 = "6"

LAYERDEPENDS_meta-poly-tc8 = "core"
LAYERSERIES_COMPAT_meta-poly-tc8 = "hardknott"
